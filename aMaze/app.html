<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gMine</title>
    <!-- Web App Manifest embedded or linked via data-uri/external file -->
    <link rel="manifest"
        href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22SPA%20Progressive%20Mastery%22%2C%22short_name%22%3A%22Mastery%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231a1a1a%22%2C%22theme_color%22%3A%22%232ed573%22%7D">

    <style>
        /* Reset and Base Styling */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar & Status Bar */
        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            box-sizing: border-box;
            z-index: 900;
            color: #fff;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 18px;
            background: linear-gradient(135deg, #ffdd5f, #fffb77);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-status {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .nav-status span strong {
            color: #2ed573;
        }

        .reset-btn {
            background-color: transparent;
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background-color: #ff4757;
            color: white;
        }

        /* Container for SPA content */
        .spa-container {
            margin: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1000px;
            width: 100%;
        }

        /* Subgroup Section Styling */
        .group-section {
            width: 100%;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }

        .group-title {
            font-size: 16px;
            color: #feb47b;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .group-grid {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            /* justify-content: center; */
            /* max-width: 1000px; */
        }

        /* Circular Div - Initially hidden off-screen (top) */
        .circle-div {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(221, 221, 221, 0.3);
            position: relative;
            top: -200px;
            opacity: 0;
            transition: transform 0.3s ease;
            user-select: none;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .circle-div:hover {
            transform: scale(1.08);
        }

        .circle-label {
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .circle-status {
            color: #fffacd;
            font-size: 10px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Class to trigger slide down */
        .circle-div.slide-down {
            animation: slideDownAnim 0.8s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideDownAnim {
            0% {
                top: -200px;
                opacity: 0;
            }

            100% {
                top: 0;
                opacity: 1;
            }
        }

        /* Fullscreen Popup Window */
        .popup-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 1000;

            opacity: 0;
            visibility: hidden;
            clip-path: circle(0% at 50% 50%);
            transition: clip-path 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;

            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 40px 20px;
            box-sizing: border-box;
        }

        .popup-window.active {
            opacity: 1;
            visibility: visible;
            clip-path: circle(150% at 50% 50%);
        }

        .close-btn {
            position: fixed;
            top: 30px;
            right: 40px;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: #ff6b81;
        }

        .popup-content {
            text-align: left;
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .complete-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin: 30px auto 0 auto;
            display: block;
            transition: background-color 0.2s;
        }

        .complete-btn:hover {
            background-color: #26af5f;
        }
    </style>
</head>

<body>

    <!-- Navbar & Status Bar -->
    <header class="navbar">
        <div class="nav-brand">gMine</div>
        <div class="nav-status">
            <span>Completed: <strong id="completedCount">0</strong> / <span id="totalCount">0</span></span>
            <span>Unlocked: <strong id="unlockedCount">0</strong></span>
        </div>
        <button class="reset-btn" onclick="resetProgress()">Reset</button>
    </header>

    <!-- Container where dynamic tasks/circles will appear -->
    <div id="spaContainer" class="spa-container"></div>

    <!-- Fullscreen Popup Window -->
    <div id="popupWindow" class="popup-window">
        <button class="close-btn" onclick="closePopup()">Close</button>
        <div class="popup-content" id="popupContainerBody"></div>
    </div>

    <script>
        let tasks = {};
        let activePopupTaskId = null;

        // Initialize SPA: Load metadata configuration from backend API & restore user state
        window.addEventListener('DOMContentLoaded', async () => {
            await loadTaskManifest();
            loadProgressFromStorage();
            evaluateAvailability();
            renderTasks();
            updateStatusBar();
        });

        // Load graph structure from Flask backend API endpoint
        async function loadTaskManifest() {
            try {
                const response = await fetch('/api/tasks');
                if (!response.ok) throw new Error('Could not load manifest from API');
                tasks = await response.json();
            } catch (error) {
                console.error("API fetch failed, fallback mock manifest loaded:", error);
                // Fallback built-in tree configuration if server is offline
                tasks = {
                    1: { id: 1, title: "First", contentUrl: "good.html", group: "root", required: [], completed: false },
                    2: { id: 2, title: "In", contentUrl: "way.html", group: "root", required: [1], completed: false }
                    // 1: { id: 1, title: "First", contentUrl: "good.html", required: [], completed: false },
                    // 2: { id: 2, title: "In", contentUrl: "way.html", required: [1], completed: false },
                    // 3: { id: 3, title: "Great", contentUrl: "god.html", required: [2], completed: false },
                    // 4: { id: 4, title: "Comfort", contentUrl: "noah1.html", required: [3], completed: false },
                };
            }
        }

        // Dynamically evaluate task unlock availability based on completed status of required prerequisite nodes
        function evaluateAvailability() {
            for (const id in tasks) {
                const task = tasks[id];
                if (!task.required || task.required.length === 0) {
                    task.unlocked = true; // Root nodes are always unlocked by default
                } else {
                    // A task unlocks only if all its required parent nodes are marked complete
                    const allRequirementsMet = task.required.every(reqId => tasks[reqId] && tasks[reqId].completed);
                    task.unlocked = allRequirementsMet;
                }
            }
        }

        // Browser Storage Integration: Save progression state
        function saveProgressToStorage() {
            const state = {};
            for (const id in tasks) {
                state[id] = {
                    completed: tasks[id].completed,
                    title: tasks[id].title
                };
            }
            localStorage.setItem('gmine_task_progress', JSON.stringify(state));
        }

        // Browser Storage Integration: Restore progression state
        function loadProgressFromStorage() {
            const savedState = localStorage.getItem('gmine_task_progress');
            if (savedState) {
                const state = JSON.parse(savedState);
                for (const id in state) {
                    if (tasks[id]) {
                        tasks[id].completed = state[id].completed;
                        if (state[id].title) {
                            tasks[id].title = state[id].title;
                        }
                    }
                }
            }
        }

        // Reset system progress completely
        function resetProgress() {
            if (confirm("Are you sure you want to reset all your progress?")) {
                localStorage.removeItem('gmine_task_progress');
                location.reload();
            }
        }

        // Update top status bar metrics
        function updateStatusBar() {
            const total = Object.keys(tasks).length;
            let completed = 0;
            let unlocked = 0;

            for (const id in tasks) {
                if (tasks[id].completed) completed++;
                if (tasks[id].unlocked) unlocked++;
            }

            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completed;
            document.getElementById('unlockedCount').innerText = unlocked;
        }

        // Function to render all unlocked circles dynamically
        function renderTasks() {
            evaluateAvailability();
            const container = document.getElementById('spaContainer');
            container.innerHTML = '';

            // Group tasks dynamically by their group/folder identifier
            const groups = {};
            for (const id in tasks) {
                const task = tasks[id];

                if (task.unlocked) {
                    const groupName = task.group || 'root';
                    if (!groups[groupName]) {
                        groups[groupName] = [];
                    }
                    groups[groupName].push(task);
                }
            }

            let globalIndex = 0;
            for (const groupName in groups) {
                const groupSection = document.createElement('div');
                groupSection.className = 'group-section';

                const titleElem = document.createElement('div');
                titleElem.className = 'group-title';
                titleElem.innerText = `${groupName}`;
                groupSection.appendChild(titleElem);

                const gridElem = document.createElement('div');
                gridElem.className = 'group-grid';

                groups[groupName].forEach(task => {
                    const circleDiv = document.createElement('div');
                    circleDiv.className = 'circle-div';
                    circleDiv.id = `task-circle-${task.id}`;

                    let statusText = task.completed ? 'Completed' : '';

                    circleDiv.innerHTML = `
                        <span class="circle-label">${task.title}</span>
                        <span class="circle-status">${statusText}</span>
                    `;

                    if (task.completed) {
                        circleDiv.style.background = 'rgb(124, 116, 47)';
                    } else {
                        circleDiv.style.background = '#000';
                    }

                    circleDiv.onclick = () => openPopup(task.id);
                    gridElem.appendChild(circleDiv);

                    const currentDelay = globalIndex * 40;
                    setTimeout(() => {
                        circleDiv.classList.add('slide-down');
                    }, currentDelay);

                    globalIndex++;
                });

                groupSection.appendChild(gridElem);
                container.appendChild(groupSection);
            }
            updateStatusBar();
        }

        async function openPopup(taskId) {
            activePopupTaskId = taskId;
            const task = tasks[taskId];
            const contentContainer = document.getElementById('popupContainerBody');

            const popup = document.getElementById('popupWindow');
            popup.scrollTop = 0;

            contentContainer.innerHTML = '<p>Loading content...</p>';

            try {
                const response = await fetch(task.contentUrl);
                if (!response.ok) throw new Error('Failed to load external file');

                const htmlText = await response.text();

                // Parse the fetched HTML text into a DOM document
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                // Option A: Extract from the <title> tag inside the task html file
                let fileTitle = doc.querySelector('title')?.innerText;

                // Option B (Alternative): Extract from an <h1> tag if you prefer header text
                if (!fileTitle) {
                    fileTitle = doc.querySelector('h1')?.innerText;
                }

                console.log(fileTitle)

                // Update the task's title dynamically if found in the file
                if (fileTitle) {
                    task.title = fileTitle;
                    renderTasks(); // Re-render circles so the new title updates on the main board too
                }


                // Display the HTML content
                contentContainer.innerHTML = htmlText;

                if (!task.completed) {
                    const btn = document.createElement('button');
                    btn.className = 'complete-btn';
                    btn.innerText = 'Complete Task';
                    btn.onclick = completeCurrentTask;
                    contentContainer.appendChild(btn);
                }
            } catch (error) {
                console.log(error)
                contentContainer.innerHTML = `
            <div style="background: #f8f9fa; padding: 30px; border-radius: 8px; border: 1px solid #e1e4e8; width: 100%; box-sizing: border-box;">
                <h2 style="color: #24292e; margin-top: 0;">${task.title}</h2>
                <p style="color: #586069; line-height: 1.6;">Could not load external file (<code>${task.contentUrl}</code>).</p>
            </div>
        `;
                if (!task.completed) {
                    const btn = document.createElement('button');
                    btn.className = 'complete-btn';
                    btn.innerText = 'Complete Task';
                    btn.onclick = completeCurrentTask;
                    contentContainer.appendChild(btn);
                }
            }

            popup.classList.add('active');
        }

        // Close popup window
        function closePopup() {
            const popup = document.getElementById('popupWindow');
            popup.classList.remove('active');
        }

        // Complete current task, persist state changes, and re-evaluate dependent nodes
        function completeCurrentTask() {
            const task = tasks[activePopupTaskId];
            if (task) {
                task.completed = true;
            }

            saveProgressToStorage();
            closePopup();
            setTimeout(renderTasks, 300);
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Learning Path Challenge</title>
    <style>
        /* CSS Variables */
        :root {
            --nav-height: 70px;
            --bg-color: #0b0f19;
            --nav-bg: #151b2b;
            --text: #e2e8f0;
            --locked: #334155;
            --unlocked: #f59e0b;
            --completed: #10b981;
            --current: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            overflow: hidden; /* Camera handles movement */
        }

        /* Sticky Navbar */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-height);
            background: var(--nav-bg);
            border-bottom: 1px solid #1e293b;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .nav-menus {
            display: flex;
            gap: 15px;
            margin-bottom: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover { background: #3b82f6; }
        
        #nav-current-title {
            color: var(--current);
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* 3D Scene container */
        #scene {
            position: fixed;
            top: var(--nav-height);
            bottom: 0; left: 0; right: 0;
            perspective: 800px;
            overflow: hidden;
        }

        #world {
            position: absolute;
            top: 50%; left: 50%;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.25, 1);
        }

        /* 3D Nodes */
        .node {
            position: absolute;
            width: 80px; height: 80px;
            margin-left: -40px; margin-top: -40px;
            border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.8rem;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.4s;
            user-select: none;
            text-align: center;
        }

        .node:hover { filter: brightness(1.3); transform: scale(1.1); }
        
        .node-label {
            position: absolute;
            bottom: -30px;
            background: rgba(0,0,0,0.8);
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Node States */
        .locked { background: var(--locked); cursor: not-allowed; opacity: 0.6; }
        .locked:hover { transform: scale(1); filter: none; }
        .unlocked { background: var(--unlocked); box-shadow: 0 0 20px var(--unlocked); }
        .completed { background: var(--completed); }
        .current { 
            background: var(--current); 
            box-shadow: 0 0 40px var(--current); 
            border: 3px solid #fff;
            transform: scale(1.1);
        }

        /* 3D Paths */
        .path-line {
            position: absolute;
            height: 12px;
            margin-top: -6px; /* Centered vertically */
            background: var(--locked);
            transform-origin: left center;
            cursor: pointer;
            transition: background 0.5s, box-shadow 0.2s;
            border-radius: 6px;
        }
        
        .path-line:hover { box-shadow: 0 0 15px white; }
        .path-line.active { background: var(--completed); }
        .path-line.unlocked { background: var(--unlocked); }

        /* Fullscreen Popups */
        .popup {
            position: fixed;
            top: var(--nav-height); /* Covers exactly everything under navbar */
            bottom: 0; left: 0; right: 0;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }

        .popup.active { opacity: 1; pointer-events: auto; }

        .popup-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            border: 1px solid #334155;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .popup-card h2 { color: var(--current); margin-bottom: 20px; font-size: 2rem; }
        .popup-card p { line-height: 1.6; margin-bottom: 30px; font-size: 1.1rem; color: #cbd5e1; }

        .popup-actions { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        
        .solve-btn { background: var(--unlocked); color: #000; font-size: 1.2rem; padding: 15px; }
        .solve-btn:hover { background: #fbbf24; }
        
        .next-path-btn { background: var(--current); font-size: 1.1rem; padding: 12px; }
        .history-btn { background: var(--completed); padding: 12px; }
        .close-btn { background: transparent; border: 1px solid #fff; margin-top: 20px; }

    </style>
</head>
<body>

    <!-- Sticky Navbar -->
    <nav>
        <div class="nav-menus">
            <button onclick="openHistory()">📜 View History</button>
            <button onclick="window.location.reload()" style="background: #ef4444;">🔄 Reset Map</button>
        </div>
        <div id="nav-current-title">Loading...</div>
    </nav>

    <!-- 3D Environment -->
    <div id="scene">
        <div id="world">
            <!-- Dynamic 3D nodes & paths injected here -->
        </div>
    </div>

    <!-- Node Challenge Popup -->
    <div id="node-popup" class="popup">
        <div class="popup-card">
            <h2 id="popup-title">Challenge Title</h2>
            <p id="popup-desc">Challenge material goes here...</p>
            
            <div id="popup-actions" class="popup-actions">
                <!-- Dynamically populated buttons -->
            </div>
            
            <button class="close-btn" onclick="closePopups()">Return to Map</button>
        </div>
    </div>

    <!-- History Popup -->
    <div id="history-popup" class="popup">
        <div class="popup-card">
            <h2>Travel History</h2>
            <p>Click any previously visited node to travel back to it.</p>
            
            <div id="history-list" class="popup-actions">
                <!-- Dynamically populated history -->
            </div>

            <button class="close-btn" onclick="closePopups()">Close History</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. DATA: Separation of Content & Structure
    // ==========================================
    
    // The Content (Loaded challenges)
    const challengesList = {
        'c_intro': { title: "1. The Awakening", text: "Welcome to the system. To proceed deeper into the path, you must grasp the foundational logic rules." },
        'c_logic': { title: "2. Logic Gate", text: "A branching path appears. To unlock the flow of data, solve the conditional matrix." },
        'c_loop': { title: "2. The Loop", text: "Repetition is power. Understand recursive functions to break the endless cycle." },
        'c_data': { title: "3. Data Stream", text: "Information flows through the backend. Tap into the stream to extract the payload." },
        'c_ui': { title: "3. Interface", text: "The user must see to believe. Construct the visual cortex." },
        'c_boss': { title: "4. The Core Node", text: "You have reached the center. Synthesize everything you have learned to dominate the system." }
    };

    // The Graph (Structure, no predefined X/Y positions)
    const treeGraph = {
        'n1': { challengeId: 'c_intro', next: ['n2_a', 'n2_b'] },
        'n2_a': { challengeId: 'c_logic', next: ['n3'] },
        'n2_b': { challengeId: 'c_loop', next: ['n4'] },
        'n3': { challengeId: 'c_data', next: ['n_boss'] },
        'n4': { challengeId: 'c_ui', next: ['n_boss'] },
        'n_boss': { challengeId: 'c_boss', next: [] } // End of tree
    };

    // State Variables
    let nodes = {}; // Will hold calculated coordinates and live state
    let currentNodeId = 'n1';
    let pathHistory = ['n1']; // Stack for history

    // DOM Elements
    const worldEl = document.getElementById('world');
    const navTitleEl = document.getElementById('nav-current-title');
    const nodePopup = document.getElementById('node-popup');
    const historyPopup = document.getElementById('history-popup');

    // ==========================================
    // 2. INITIALIZATION & 3D LAYOUT ALGORITHM
    // ==========================================
    function initApp() {
        // Build coordinates dynamically using a recursive depth algorithm
        // Current/root starts at (0,0,0). Children go UP (negative Y) and INTO SCREEN (negative Z).
        calculateLayout('n1', 0, 0, 0, 800);
        
        // Initialize Root Node State
        nodes['n1'].status = 'current';

        renderScene();
        updateNavbar();
    }

    function calculateLayout(nodeId, x, y, z, horizontalSpread) {
        // If node already calculated (e.g., multiple parents pointing to the same child), skip recalculation.
        if (nodes[nodeId]) return;

        nodes[nodeId] = { id: nodeId, status: 'locked', x, y, z };
        
        const children = treeGraph[nodeId].next;
        if (!children || children.length === 0) return;

        // Spread children horizontally across the available width
        const step = horizontalSpread / Math.max(1, children.length);
        let currentX = x - (horizontalSpread / 2) + (step / 2);
        
        children.forEach(childId => {
            // Push children up (-250px) and deep into the screen (-600px Z-index)
            calculateLayout(childId, currentX, y - 250, z - 600, horizontalSpread * 0.7);
            currentX += step;
        });
    }

    // ==========================================
    // 3. RENDERING ENGINE
    // ==========================================
    function renderScene() {
        worldEl.innerHTML = ''; // Clear previous render

        // 1. Render all connecting paths (Lines)
        Object.keys(treeGraph).forEach(parentId => {
            const parent = nodes[parentId];
            treeGraph[parentId].next.forEach(childId => {
                const child = nodes[childId];
                drawLine(parent, child);
            });
        });

        // 2. Render all nodes
        Object.values(nodes).forEach(node => {
            const el = document.createElement('div');
            el.className = `node ${node.status}`;
            el.id = `node-${node.id}`;
            
            // Apply calculated 3D coordinates
            el.style.transform = `translate3d(${node.x}px, ${node.y}px, ${node.z}px)`;
            
            // Icon logic based on status
            let icon = '🔒';
            if (node.status === 'completed') icon = '✔️';
            if (node.status === 'current') icon = '📍';
            if (node.status === 'unlocked') icon = '⭐';

            const challenge = challengesList[treeGraph[node.id].challengeId];
            
            el.innerHTML = `
                <div style="font-size:24px;">${icon}</div>
                <div class="node-label">${challenge.title}</div>
            `;
            
            // Click Event
            el.onclick = (e) => {
                e.stopPropagation();
                handleNodeClick(node.id);
            };
            
            worldEl.appendChild(el);
        });

        updateCamera();
    }

// Math to draw a 3D line between two XYZ coordinates using CSS transforms
    function drawLine(p1, p2) {
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dz = p2.z - p1.z;
        
        const distXZ = Math.hypot(dx, dz);
        const dist = Math.hypot(distXZ, dy);
        
        // CSS angles calculations
        const rotY = Math.atan2(-dz, dx);
        const rotZ = Math.atan2(dy, distXZ);

        const line = document.createElement('div');
        
        // Status classes for line color
        let statusClass = '';
        if (p1.status === 'completed' || p1.status === 'current') {
            if (p2.status !== 'locked') statusClass = 'unlocked';
            if (p2.status === 'completed' || p2.status === 'current') statusClass = 'active';
        }
        
        line.className = `path-line ${statusClass}`;
        line.style.width = `${dist}px`;
        
        // THE FIX: Added rotateX(90deg) at the end. 
        // This takes the vertical "wall" and lays it flat into a horizontal "road" 
        // so it is always visible from the camera's elevated perspective!
        line.style.transform = `translate3d(${p1.x}px, ${p1.y}px, ${p1.z}px) rotateY(${rotY}rad) rotateZ(${rotZ}rad) rotateX(90deg)`;
        
        // Interaction: Clicking a path takes you to the previous node
        line.onclick = (e) => {
            e.stopPropagation();
            if (currentNodeId === p2.id) {
                // If we are currently at the child, click path to go back to parent
                navigateTo(p1.id);
            } else if (currentNodeId === p1.id && p2.status !== 'locked') {
                // If we are at parent, click path to go to child
                navigateTo(p2.id);
            }
        };

        worldEl.appendChild(line);
    }

    // Adjust the camera so the active node stays centered in the foreground
    function updateCamera() {
        const active = nodes[currentNodeId];

        // Dynamically adjust offsets based on depth (Z position) to keep nodes centered
        const depthFactor = Math.abs(active.z) / 600; // Scales with tree depth level
        const cameraZOffset = 350 + (depthFactor * 50);
        const cameraYOffset = 220 + (depthFactor * 40); // Dynamically shifts view downward for deeper nodes

        // Apply world translation and a smooth perspective tilt
        worldEl.style.transform = `translate3d(${-active.x}px, ${-active.y + cameraYOffset}px, ${-active.z + cameraZOffset}px) rotateX(-10deg)`;
    }
    function updateNavbar() {
        const title = challengesList[treeGraph[currentNodeId].challengeId].title;
        navTitleEl.innerText = `Current Location: ${title}`;
    }

    // ==========================================
    // 4. NAVIGATION & LOGIC
    // ==========================================
    function handleNodeClick(id) {
        if (nodes[id].status === 'locked') return;

        if (id === currentNodeId) {
            openNodePopup(id);
        } else {
            navigateTo(id);
        }
    }

    function navigateTo(id) {
        // Change old current to completed (if it was solved previously) or unlocked
        const oldCurrent = nodes[currentNodeId];
        oldCurrent.status = oldCurrent.completedFlag ? 'completed' : 'unlocked';
        
        // Assign new current
        nodes[id].status = 'current';
        currentNodeId = id;
        
        // Push to history
        if (pathHistory[pathHistory.length - 1] !== id) {
            pathHistory.push(id);
        }

        closePopups();
        renderScene();
        updateNavbar();
    }

    // ==========================================
    // 5. MODAL/POPUP LOGIC
    // ==========================================
    function openNodePopup(id) {
        const node = nodes[id];
        const challenge = challengesList[treeGraph[id].challengeId];
        
        document.getElementById('popup-title').innerText = challenge.title;
        document.getElementById('popup-desc').innerText = challenge.text;
        
        const actionsBox = document.getElementById('popup-actions');
        actionsBox.innerHTML = '';

        if (!node.completedFlag) {
            // Not solved yet -> Show solve button
            const btn = document.createElement('button');
            btn.className = 'solve-btn';
            btn.innerText = "Challenge Solved: Comprehend Material!";
            btn.onclick = () => completeChallenge(id);
            actionsBox.appendChild(btn);
        } else {
            // Solved -> Show unlocked next paths
            const notice = document.createElement('div');
            notice.style.color = 'var(--completed)';
            notice.style.fontWeight = 'bold';
            notice.innerText = "✓ Material Comprehended";
            actionsBox.appendChild(notice);

            const children = treeGraph[id].next;
            if (children.length > 0) {
                const lbl = document.createElement('p');
                lbl.innerText = 'Select a path to advance:';
                lbl.style.margin = "10px 0";
                actionsBox.appendChild(lbl);

                children.forEach(childId => {
                    const childData = challengesList[treeGraph[childId].challengeId];
                    const btn = document.createElement('button');
                    btn.className = 'next-path-btn';
                    btn.innerText = `Travel to: ${childData.title} →`;
                    btn.onclick = () => navigateTo(childId);
                    actionsBox.appendChild(btn);
                });
            } else {
                actionsBox.innerHTML += `<br><h3 style="color:var(--unlocked)">You have mastered the final core.</h3>`;
            }
        }
        
        nodePopup.classList.add('active');
    }

    function completeChallenge(id) {
        nodes[id].completedFlag = true;
        
        // Unlock immediate children
        treeGraph[id].next.forEach(childId => {
            if (nodes[childId].status === 'locked') {
                nodes[childId].status = 'unlocked';
            }
        });

        // Re-render popup content to show new paths
        openNodePopup(id);
        
        // Re-render scene in background so lines light up
        renderScene(); 
    }

    function openHistory() {
        const listContainer = document.getElementById('history-list');
        listContainer.innerHTML = '';

        // Reverse history to show newest at top, map unique instances
        const uniqueHistory = [...new Set(pathHistory)].reverse();

        uniqueHistory.forEach(id => {
            const chall = challengesList[treeGraph[id].challengeId];
            const btn = document.createElement('button');
            btn.className = 'history-btn';
            btn.innerText = `${id === currentNodeId ? '📍 [Active] ' : ''} ${chall.title}`;
            btn.onclick = () => navigateTo(id);
            listContainer.appendChild(btn);
        });

        historyPopup.classList.add('active');
    }

    function closePopups() {
        nodePopup.classList.remove('active');
        historyPopup.classList.remove('active');
    }

    // Launch Application
    window.onload = initApp;
</script>
</body>
</html>
